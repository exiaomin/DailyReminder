name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build iOS Project
      env:
        CODE_SIGNING_ALLOWED: NO
      run: |
        xcodebuild -project DailyReminder.xcodeproj \
          -scheme DailyReminder \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build 2>&1 | tail -50

    - name: Create IPA
      run: |
        APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
        echo "App path: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "Build failed - no app found"
          exit 1
        fi
        mkdir -p output
        cp -r "$APP_PATH" ./output/
        cd output
        zip -r DailyReminder.ipa DailyReminder.app
        ls -la

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: DailyReminder-IPA
        path: output/DailyReminder.ipa
