name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: List files
      run: ls -la

    - name: Build iOS Project
      env:
        CODE_SIGNING_ALLOWED: NO
      run: |
        xcodebuild -project DailyReminder.xcodeproj \
          -scheme DailyReminder \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build 2>&1

    - name: Verify Build
      run: |
        ls -la build/Build/Products/Debug-iphoneos/ || echo "Build directory not found, checking alternative paths..."
        find build -name "*.app" -type d 2>/dev/null || true

    - name: Create IPA
      run: |
        APP_PATH=$(find build -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "No app found in build output"
          exit 1
        fi
        mkdir -p output
        cp -r "$APP_PATH" ./output/
        cd output
        zip -r DailyReminder.ipa *.app
        ls -la

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DailyReminder-IPA
        path: output/DailyReminder.ipa
