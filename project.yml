name: DailyReminder
options:
  bundleIdPrefix: com.dailyreminder
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DailyReminder:
    type: application
    platform: iOS
    sources:
      - path: DailyReminder
        type: group
    settings:
      base:
        INFOPLIST_FILE: DailyReminder/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyreminder.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
